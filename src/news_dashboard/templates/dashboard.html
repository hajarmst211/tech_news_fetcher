{% extends "base.html" %}
{% block title %}Signal — Dashboard{% endblock %}
{% block content %}
<div class="dashboard-page">
    <h1 class="dash-title">dashboard</h1>

    <section class="dash-section">
        <div class="dash-section-header">
            <h2>n-grams, most frequent <span class="dash-sub">(tf-idf weight, cosine-deduped)</span></h2>
            <div class="ngram-tabs" id="ngram-tabs">
                <button data-n="1" class="ngram-tab active">n = 1</button>
                <button data-n="2" class="ngram-tab">n = 2</button>
                <button data-n="3" class="ngram-tab">n = 3</button>
                <button data-n="4" class="ngram-tab">n = 4</button>
            </div>
        </div>
        <div class="chart-frame">
            <canvas id="ngram-chart"></canvas>
        </div>
    </section>

    <section class="dash-section">
        <div class="dash-section-header">
            <h2>topics, most frequent</h2>
        </div>
        <div class="chart-frame">
            <canvas id="topics-chart"></canvas>
        </div>
    </section>

    <section class="dash-section">
        <div class="dash-section-header">
            <h2>sentiment / trend by topic</h2>
            <select id="topic-select" class="topic-select">
                <option value="">all topics</option>
            </select>
        </div>
        <div class="chart-frame">
            <canvas id="sentiment-chart"></canvas>
        </div>
    </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
